[project]
name = "scaffoldgenerator"
version = "0.1.3"
description = "Creates a project's file system structure driven by an ASCII diagram."
readme = "README.md"
authors = [
    { name = "Jonathan Jarrett", email = "jonathan.jarrett@comcast.net" }
]
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.0.2",
]

[project.scripts]
scaffold_generator = "scaffoldgenerator.scaffold_generator:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "src/scaffoldgenerator"]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["scaffoldgenerator"]

[tool.coverage.report]
show_missing = true
skip_covered = false
